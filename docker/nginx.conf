# ---------------------------------------------------------------------------
# Конфигурация nginx для раздачи собранного приложения (apps/web/dist).
#
# Главное требование — Cross-Origin Isolation: WASM-движок LibreOffice
# многопоточный (Emscripten + pthreads) и требует SharedArrayBuffer, который
# браузер отдаёт только при заголовках COOP/COEP/CORP. Без них конвертация
# не запустится. Подробнее — в README, раздел «Cross-Origin Isolation».
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cross-Origin Isolation (обязательно) -------------------------------
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- Сжатие (только текст; WASM-бинарники не сжимаем) -------------------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- SPA-fallback: незнакомые пути отдают index.html ---------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Крупные ресурсы WASM-движка (~240 МБ) ------------------------------
    # Имена файлов без хэшей, поэтому кэш ограничен неделей, а не годом
    location /wasm/ {
        try_files $uri =404;
        expires 7d;
    }

    # Модули библиотеки (browser.worker.global.js и сопутствующие)
    location /dist/ {
        try_files $uri =404;
        expires 7d;
    }

    # Vite-бандлы с хэшами в именах можно кэшировать агрессивно.
    # Внимание: add_header внутри location отменяет наследование add_header
    # из server-блока, поэтому COOP/COEP/CORP продублированы здесь —
    # без CORP браузер заблокирует скрипты воркеров при COEP require-corp
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # --- Эндпоинт для healthcheck'а -----------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
